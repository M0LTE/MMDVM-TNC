name: Host tests

# Pull requests only: pushes to master run the full test, build and release
# pipeline in build-firmware.yml.
on:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Build and run the host test suite
        run: make -C test

      - name: Re-run under the sanitisers
        run: make -C test clean && make -C test SAN=1

  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Build the fuzzers and generate the seed corpora
        run: make -C test/fuzz

      - name: Fuzz each target briefly
        run: make -C test/fuzz run TIME=30
