name: Host tests

# Pull requests and master. Not every branch push -- the PR run is the one
# that gates a merge.
on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Build and run the host test suite
        run: make -C test

      - name: Re-run under the sanitisers
        run: make -C test clean && make -C test SAN=1
