name: Host tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Build and run the host test suite
        run: make -C test

      - name: Re-run under the sanitisers
        run: make -C test clean && make -C test SAN=1
